[project]
name = "friday-backend"
version = "0.1.0"
description = "FRIDAY Django REST API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cryptography>=50.0.1",
    "django>=5.2,<5.3",
    "django-allauth[headless,mfa]>=65.19.4,<66",
    "djangorestframework>=3.16,<4",
    "elasticsearch>=9,<10",
    "httpx>=0.28,<0.29",
    "jwcrypto>=1.5,<2",
    "openai-agents>=0.22.3",
    "pydantic>=2,<3",
    "python-dotenv>=1.1,<2",
]

[tool.uv]
package = false
